# LayerOSX compositor (picom) -- only for looks: rounded corners on the kiosk's
# own windows (terminal, dialogs). Kept deliberately light:
#  * unredir-if-possible: any fullscreen window (the macOS VM -- QEMU/SDL or
#    Reims' Vulkan window) bypasses the compositor entirely, so the VM's frame
#    pacing and latency are untouched.
#  * xrender backend, no vsync, no shadows/fading/blur: nothing GPU-heavy.
#  * GTK4/libadwaita windows (LayerOSX Settings, zenity 4) draw their own
#    rounded corners and shadows (client-side decorations), so they're excluded.
# Turn it off with: echo off > /var/lib/layerosx/compositor   (then reboot)
backend = "xrender";
vsync = false;
unredir-if-possible = true;
shadow = false;
fading = false;
corner-radius = 12;
rounded-corners-exclude = [
  "_GTK_FRAME_EXTENTS@:c",
  "name = 'Reims vGPU'",
  "class_g ?= 'qemu-system-x86_64'",
  "name *= 'QEMU'",
  "fullscreen"
];
