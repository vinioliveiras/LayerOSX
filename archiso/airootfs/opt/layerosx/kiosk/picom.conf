# LayerOSX compositor (picom 12) -- only for looks, kept deliberately light:
#  * rounded corners on the kiosk's own windows (terminal, dialogs);
#  * GNOME-style open/close animations: a window opens scaling up from 50%
#    while fading in (0.15 s, ease-out-expo -- GNOME Shell's _mapWindow), and
#    closes shrinking to 80% while fading out (0.15 s, ease-out-quad --
#    GNOME's _destroyWindow).
#  * unredir-if-possible: the fullscreen macOS VM (QEMU/SDL or Reims' Vulkan
#    window) bypasses the compositor entirely, so its frame pacing and latency
#    are untouched. The catch: while unredirected, picom can't see a new
#    window's first frames, so the open animation would be skipped for the
#    panel/terminal opened over the VM. layerosx_style.present_animated()
#    works around it: it maps a 1x1 "layerosx-kick" window first (picom
#    redirects the screen), then shows the real window 80 ms later. The kick
#    window is 1% opaque, 1 pixel, parked at 0,0 (rule below + openbox).
#  * xrender backend, no vsync, no shadows/blur: nothing GPU-heavy.
#  * GTK4/libadwaita windows (LayerOSX Settings/Terminal, zenity 4) draw their
#    own rounded corners and shadows (client-side decorations): no corner
#    rounding from picom, but they do get the animations.
# Window rules (`rules`) replace the old per-window options (rounded-corners-
# exclude, ...): picom 12 ignores those when `rules` is set.
# Turn the compositor off with: echo off > /var/lib/layerosx/compositor   (then reboot)
backend = "xrender";
vsync = false;
unredir-if-possible = true;
shadow = false;
fading = false;
corner-radius = 12;

rules = (
  # Animations for ordinary windows -- never the Mac's window.
  {
    match = "(window_type = 'normal' || window_type = 'dialog' || window_type = 'utility') && !(name = 'Reims vGPU' || class_g ?= 'qemu-system-x86_64' || name *= 'QEMU' || name = 'layerosx-kick')";
    animations = (
      {
        triggers = [ "open", "show" ];
        opacity = { curve = "cubic-bezier(0.16, 1, 0.3, 1)"; duration = 0.15; start = 0; end = "window-raw-opacity"; };
        scale-x = { curve = "cubic-bezier(0.16, 1, 0.3, 1)"; duration = 0.15; start = 0.5; end = 1; };
        scale-y = "scale-x";
        offset-x = "(1 - scale-x) / 2 * window-width";
        offset-y = "(1 - scale-y) / 2 * window-height";
        shadow-scale-x = "scale-x"; shadow-scale-y = "scale-y";
        shadow-offset-x = "offset-x"; shadow-offset-y = "offset-y";
        blur-opacity = "opacity"; shadow-opacity = "opacity";
      },
      {
        triggers = [ "close", "hide" ];
        opacity = { curve = "cubic-bezier(0.5, 1, 0.89, 1)"; duration = 0.15; start = "window-raw-opacity-before"; end = 0; };
        scale-x = { curve = "cubic-bezier(0.5, 1, 0.89, 1)"; duration = 0.15; start = 1; end = 0.8; };
        scale-y = "scale-x";
        offset-x = "(1 - scale-x) / 2 * window-width";
        offset-y = "(1 - scale-y) / 2 * window-height";
        shadow-scale-x = "scale-x"; shadow-scale-y = "scale-y";
        shadow-offset-x = "offset-x"; shadow-offset-y = "offset-y";
        blur-opacity = "opacity"; shadow-opacity = "opacity";
      }
    );
  },
  # Client-side-decorated GTK windows round their own corners.
  { match = "_GTK_FRAME_EXTENTS@"; corner-radius = 0; },
  # The Mac's window and anything fullscreen: square, untouched.
  { match = "name = 'Reims vGPU' || class_g ?= 'qemu-system-x86_64' || name *= 'QEMU' || fullscreen"; corner-radius = 0; },
  # present_animated()'s 1x1 helper: practically invisible. NOT 0 -- a window
  # at opacity 0 isn't painted, so it wouldn't make picom redirect the screen
  # (verified: with 0 the panel's open animation was still skipped).
  { match = "name = 'layerosx-kick'"; opacity = 0.01; corner-radius = 0; },
);
