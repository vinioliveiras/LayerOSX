# LayerOSX: compressed swap in RAM (zram), a quarter of the machine's RAM, at
# most 8 GB. Only reached under memory pressure (vm.swappiness = 10); keeps
# Linux from the OOM killer instead of stalling on a disk swap file. The Mac's
# huge-page RAM is never swapped.
[zram0]
zram-size = min(ram / 4, 8192)
compression-algorithm = zstd
swap-priority = 100
