# LayerOSX: closing the lid suspends the host (the VM is paused/resumed around
# it by /usr/lib/systemd/system-sleep/layerosx-vm). With an external monitor
# connected (docked), closing the lid does nothing, so the VM keeps running on
# the external screen.
[Login]
HandleLidSwitch=suspend
HandleLidSwitchExternalPower=suspend
HandleLidSwitchDocked=ignore
