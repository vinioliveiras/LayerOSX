# Auto-login the F2 debug console (tty2) as the "mac" user, so switching to it
# with Ctrl+Alt+F2 drops straight into a shell in /home/mac (where the VM's
# logs live) with no password prompt -- same idea as tty1's kiosk autologin.
[Service]
ExecStart=
ExecStart=-/sbin/agetty -o '-p -f -- \\u' --noclear --autologin mac %I $TERM
