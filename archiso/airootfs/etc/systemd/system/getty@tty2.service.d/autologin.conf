# tty2 (Ctrl+Alt+F2 -- only reachable while "Text consoles" is on in LayerOSX
# Settings > General) follows the Ctrl+Alt+T terminal policy: auto-login as
# "mac" when it's `open`, a login prompt for `password`, nothing for `off`.
# See /opt/layerosx/kiosk/lib/tty2-getty.sh.
[Service]
ExecStart=
ExecStart=-/opt/layerosx/kiosk/lib/tty2-getty.sh %I $TERM
