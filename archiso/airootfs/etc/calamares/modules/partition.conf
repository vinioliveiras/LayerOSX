---
# The only genuinely interactive page of the installer. We keep
# Calamares's normal options (Erase disk / Replace partition /
# Manual) — this is where you reuse the existing ~200 MB EFI
# partition and decide where everything else goes (the macOS VM disk
# lives inside the Arch system itself, at /var/lib/layerosx/, it
# doesn't need its own partition).
efi:
    mountPoint: "/boot"

userSwapChoices:
    - none
    - small
    - suspend
    - reuse

availableFileSystemTypes: ["ext4", "btrfs"]
defaultFileSystemType: "ext4"

initialPartitioningChoice: none
initialSwapChoice: none

canBeResized: true
enableLuksAutomatedPartitioning: false
drawNestedPartitions: false
alwaysShowPartitionLabels: true
allowManualPartitioning: true
