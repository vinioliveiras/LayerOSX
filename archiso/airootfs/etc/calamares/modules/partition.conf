---
# Única página interativa a sério do instalador. Mantemos as opções
# normais do Calamares (Erase disk / Replace partition / Manual) —
# é aqui que reaproveitas a EFI de ~200 MB já existente e decides onde
# fica o resto (o disco da VM do macOS mora dentro do próprio sistema
# Arch, em /var/lib/layerosx/, não precisa de partição própria).
efi:
    mountPoint: "/boot"

userSwapChoices:
    - none
    - small
    - suspend
    - reuse

availableFileSystemTypes: ["ext4", "btrfs"]
defaultFileSystemType: "ext4"

initialPartitioningChoice: none
initialSwapChoice: none

canBeResized: true
enableLuksAutomatedPartitioning: false
drawNestedPartitions: false
alwaysShowPartitionLabels: true
allowManualPartitioning: true
