---
# Corre já dentro do sistema recém-copiado (chroot automático do
# shellprocess). É aqui que locale, teclado, hostname, utilizador,
# NVIDIA/KVM, GRUB e o kiosk ficam todos prontos, sem UI nenhuma.
dontChroot: false
timeout: 3600
script:
    - command: "/root/postinstall/run.sh"
      timeout: 3600
