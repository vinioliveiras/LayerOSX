---
# Runs already inside the freshly-copied system (shellprocess's
# automatic chroot). This is where locale, keyboard, hostname, user,
# NVIDIA/KVM, GRUB and the kiosk all get set up, with no UI at all.
dontChroot: false
timeout: 3600
script:
    - command: "/root/postinstall/run.sh"
      timeout: 3600
