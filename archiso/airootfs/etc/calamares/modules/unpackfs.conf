---
# Copia o rootfs do live (o squashfs gerado pelo mkarchiso) para o
# destino escolhido na partição. Caminho derivado do install_dir
# ("layerosx") definido em archiso/profiledef.sh — se mudares um, muda
# o outro.
unpack:
    - source: "/run/archiso/bootmnt/layerosx/x86_64/airootfs.sfs"
      sourcefs: "squashfs"
      destination: ""
