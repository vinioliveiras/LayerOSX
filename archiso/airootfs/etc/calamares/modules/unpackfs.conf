---
# Copies the live rootfs (the squashfs built by mkarchiso) to the
# chosen destination. Path derived from install_dir ("layerosx"),
# defined in archiso/profiledef.sh — if you change one, change the
# other.
unpack:
    - source: "/run/archiso/bootmnt/layerosx/x86_64/airootfs.sfs"
      sourcefs: "squashfs"
      destination: ""
