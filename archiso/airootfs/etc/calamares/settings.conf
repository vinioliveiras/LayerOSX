# settings.conf — LayerOSX
#
# Philosophy: only partitioning stays interactive (it's the only
# decision that can't be safely automated, and it's the one Calamares
# does well, with real UI). Locale, keyboard (en_US/us — the real
# layout comes from inside the macOS VM), user, bootloader, etc. do
# NOT use Calamares's normal modules (those require UI pages to fill
# GlobalStorage) — they all live inside a single shellprocess
# (postinstall/run.sh), which runs already inside the installed system
# (chroot) and does all of that with fixed values, without asking
# anything.

modules-search: [ local ]

instances:
- id: postinstall
  module: shellprocess
  config: shellprocess-postinstall.conf

sequence:
- show:
  - welcome
  - partition
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  - machineid
  - fstab
  - shellprocess@postinstall
  - umount
- show:
  - finished

branding: layerosx
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
quit-at-end: false
