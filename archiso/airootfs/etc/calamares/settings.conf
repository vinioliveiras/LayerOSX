# settings.conf — LayerOSX
#
# Filosofia: só a partição fica interativa (é a única decisão que não dá
# pra automatizar com segurança, e é a que a Calamares faz bem, com UI a
# sério). Locale, teclado (en_US/us — o layout real vai vir de dentro da
# VM do macOS), utilizador, bootloader, etc. NÃO usam os módulos normais
# do Calamares (esses exigem paginas de UI para preencher o
# GlobalStorage) — ficam todos dentro de um único shellprocess
# (postinstall/run.sh), que corre já dentro do sistema instalado
# (chroot) e faz tudo isso com valores fixos, sem perguntar nada.

modules-search: [ local ]

instances:
- id: postinstall
  module: shellprocess
  config: shellprocess-postinstall.conf

sequence:
- show:
  - welcome
  - partition
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  - machineid
  - fstab
  - shellprocess@postinstall
  - umount
- show:
  - finished

branding: layerosx
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
quit-at-end: false
