# LayerOSX: let the Mac's RAM use 2 MB pages.
#
# Reims needs the guest RAM in a shared memfd (-object memory-backend-memfd,
# share=on), and memfd memory is shmem -- which Linux backs with 4 KB pages
# unless shmem transparent huge pages are allowed (Arch's default: "never").
# QEMU already madvise(MADV_HUGEPAGE)s all guest RAM, so "advise" gives the
# Mac 2 MB pages exactly there and nowhere else: far fewer TLB misses and
# page-table walks for a ~55 GB guest (felt in video playback, big apps).
# "w" writes only if the file exists (older kernels lack the per-size knob).
w /sys/kernel/mm/transparent_hugepage/shmem_enabled - - - - advise
w /sys/kernel/mm/transparent_hugepage/hugepages-2048kB/shmem_enabled - - - - inherit
