# LayerOSX: a host whose one job is running the Mac smoothly.
# Values are machine-independent (fixed byte sizes, not % of RAM).

# The Mac's RAM is most of the machine; Linux should keep its own working set
# in RAM and use swap (zram, see systemd/zram-generator.conf) only as a last resort.
vm.swappiness = 10
vm.vfs_cache_pressure = 50

# Write dirty pages back early and in small batches: with the default 20% of
# a 64 GB host, a big download could pile up ~12 GB and then stall everything
# while it's flushed.
vm.dirty_bytes = 268435456
vm.dirty_background_bytes = 67108864

# No background memory compaction (it walks memory at random times -- short
# host stalls). lib/hugepages.sh compacts once, on purpose, before a Mac start.
vm.compaction_proactiveness = 0

# No lockup-detector NMIs interrupting the vCPUs every few seconds.
kernel.nmi_watchdog = 0
kernel.watchdog = 0

# Intel only (ignored elsewhere): don't slow a process down 10 ms for each
# split lock -- guests, including macOS, can trigger them.
-kernel.split_lock_mitigate = 0

# The Mac's internet goes through the host's TCP (QEMU's NAT): BBR keeps
# throughput up on Wi-Fi and lossy links, fq paces it.
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr
