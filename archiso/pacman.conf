[options]
HoldPkg     = pacman glibc
Architecture = auto
CheckSpace
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional
ParallelDownloads = 5

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

# Calamares isn't in the official Arch repos (core/extra) — only in the
# AUR. Chaotic-AUR mirrors AUR packages as prebuilt binaries, which is
# what lets a plain archiso/pacman-based build pull it in directly. See
# README.md for the one-time build-host setup this repo needs (import
# its signing key + install chaotic-keyring/chaotic-mirrorlist) before
# this Include path resolves.
[chaotic-aur]
Include = /etc/pacman.d/chaotic-mirrorlist
